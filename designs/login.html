<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ROMER ALPHA - Institutional Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e1e2eb",
                        "secondary-container": "#00f4b3",
                        "tertiary-container": "#6a6c74",
                        "on-surface-variant": "#c3c5d9",
                        "outline-variant": "#434656",
                        "surface": "#111318",
                        "on-tertiary-fixed": "#191c22",
                        "inverse-surface": "#e2e2e8",
                        "on-primary-fixed": "#001550",
                        "on-background": "#e2e2e8",
                        "surface-container-high": "#282a2e",
                        "outline": "#8d90a2",
                        "on-secondary": "#003826",
                        "surface-container-lowest": "#0c0e12",
                        "on-secondary-fixed-variant": "#005139",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2f3035",
                        "background": "#111318",
                        "on-tertiary-container": "#edeef7",
                        "surface-bright": "#37393e",
                        "primary-fixed": "#dce1ff",
                        "surface-container": "#1e2024",
                        "secondary-fixed-dim": "#00e1a5",
                        "on-secondary-container": "#006b4c",
                        "primary": "#b6c4ff",
                        "surface-variant": "#333539",
                        "secondary": "#ccffe5",
                        "on-secondary-fixed": "#002115",
                        "on-surface": "#e2e2e8",
                        "surface-tint": "#b6c4ff",
                        "on-primary-container": "#edeeff",
                        "on-primary": "#00277f",
                        "surface-container-low": "#1a1c20",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#3effbf",
                        "error-container": "#93000a",
                        "tertiary": "#c4c6cf",
                        "on-primary-fixed-variant": "#003ab2",
                        "primary-fixed-dim": "#b6c4ff",
                        "primary-container": "#1a5cff",
                        "tertiary-fixed-dim": "#c4c6cf",
                        "surface-container-highest": "#333539",
                        "on-tertiary-fixed-variant": "#44474e",
                        "on-error": "#690005",
                        "on-tertiary": "#2d3037",
                        "inverse-primary": "#004ee8",
                        "surface-dim": "#111318"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "widget-gap": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "data-md": ["JetBrains Mono"],
                        "body-md": ["Inter Tight"],
                        "body-lg": ["Inter Tight"],
                        "headline-sm": ["Inter Tight"],
                        "display-lg": ["Inter Tight"],
                        "data-lg": ["JetBrains Mono"],
                        "headline-md": ["Inter Tight"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "data-md": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "data-lg": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .obsidian-bg {
            background-color: #0A0C10; /* Base Level 0 */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        
        .widget-layer {
            background-color: #0F1218; /* Level 1 */
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 24px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(67, 70, 86, 0.3); /* outline-variant */
        }
        
        .glass-active {
            background-color: rgba(22, 25, 32, 0.8); /* Level 2 */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 20px 40px -10px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-inset {
            background-color: #0A0C10;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(67, 70, 86, 0.5);
        }
        
        .input-inset:focus-within {
            border-color: #1a5cff;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 0 1px #1a5cff;
        }

        .btn-cobalt {
            background: linear-gradient(180deg, #1a5cff 0%, #004ee8 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(26, 92, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        .btn-cobalt:hover {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 16px rgba(26, 92, 255, 0.5);
            transform: translateY(-1px);
        }
        
        .btn-cobalt:active {
            transform: translateY(1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 4px rgba(26, 92, 255, 0.2);
        }

        .btn-ghost {
            background-color: transparent;
            border: 1px solid rgba(67, 70, 86, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        
        .btn-ghost:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(67, 70, 86, 0.8);
        }
        
        /* Material symbols specific styling */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="obsidian-bg min-h-screen flex items-center justify-center text-on-surface p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Ambient glow behind the card -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-container rounded-full opacity-5 blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-[440px] glass-active rounded-xl p-8 relative z-10">
<!-- Header -->
<div class="text-center mb-10">
<div class="flex items-center justify-center gap-3 mb-6">
<div class="w-10 h-10 rounded-lg widget-layer flex items-center justify-center border-t border-white/10">
<span class="material-symbols-outlined text-primary-container">shield_lock</span>
</div>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 tracking-tight">ROMER ALPHA</h1>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Institutional Access Portal</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- ID Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="terminal-id">
<span class="material-symbols-outlined text-[14px]">badge</span>
                    Terminal ID / Credential
                </label>
<div class="relative input-inset rounded-lg flex items-center px-4 py-3 group">
<input autocomplete="off" class="bg-transparent border-none w-full font-data-md text-data-md text-on-surface focus:ring-0 p-0 placeholder:text-outline-variant" id="terminal-id" placeholder="Enter assigned identifier" type="text"/>
<div class="w-2 h-2 rounded-full bg-secondary-container/20 group-focus-within:bg-secondary-container group-focus-within:shadow-[0_0_8px_rgba(0,244,179,0.5)] transition-all ml-2"></div>
</div>
</div>
<!-- Passkey Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="passkey">
<span class="material-symbols-outlined text-[14px]">key</span>
                        Authorization Key
                    </label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Recover</a>
</div>
<div class="relative input-inset rounded-lg flex items-center px-4 py-3 group">
<input class="bg-transparent border-none w-full font-data-md text-data-md text-on-surface focus:ring-0 p-0 placeholder:text-outline-variant tracking-widest" id="passkey" placeholder="••••••••••••" type="password"/>
<button class="text-outline-variant hover:text-on-surface transition-colors ml-2 flex items-center" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full btn-cobalt rounded-lg py-3.5 px-6 font-body-md text-body-md font-medium text-white flex justify-center items-center gap-2" type="submit">
                    Initialize Session
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-label-caps text-label-caps text-outline-variant">OR AUTHENTICATE VIA</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full btn-ghost rounded-lg py-3 px-6 font-body-md text-body-md text-on-surface flex justify-center items-center gap-2" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">fingerprint</span>
                    Biometric Hardware Key
                </button>
</div>
</form>
<!-- Footer -->
<div class="mt-8 pt-6 border-t border-outline-variant/20 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-container shadow-[0_0_8px_rgba(0,244,179,0.6)]"></div>
<span class="font-label-caps text-label-caps text-secondary-container">System Online</span>
</div>
<span class="font-label-caps text-[10px] text-outline-variant tracking-wider">v.2.4.9-SECURE</span>
</div>
</div>
<!-- Decorative corner accents -->
<div class="fixed top-8 left-8 w-4 h-4 border-t border-l border-outline-variant/30 pointer-events-none"></div>
<div class="fixed top-8 right-8 w-4 h-4 border-t border-r border-outline-variant/30 pointer-events-none"></div>
<div class="fixed bottom-8 left-8 w-4 h-4 border-b border-l border-outline-variant/30 pointer-events-none"></div>
<div class="fixed bottom-8 right-8 w-4 h-4 border-b border-r border-outline-variant/30 pointer-events-none"></div>
</body></html>
